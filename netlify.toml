[build]
  command = "pnpm run build:netlify"
  publish = "dist-netlify"

[build.environment]
  NODE_VERSION = "24.19.0"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
