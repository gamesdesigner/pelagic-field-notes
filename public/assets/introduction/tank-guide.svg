<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">Three variables in the plankton population lab</title><desc id="desc">One: drag nitrogen, phosphorus or silicate into the water. Two: adjust Water temperature. Three: Add fish or Remove fish. Compare the population readouts and graph. This is an illustration, not live data.</desc><rect width="900" height="690" rx="20" fill="#e1e9e3"/><g font-family="Arial,sans-serif" fill="#173f47"><text x="35" y="42" font-size="17" letter-spacing="2">ILLUSTRATED POPULATION GUIDE</text><text x="35" y="84" font-size="30" font-weight="bold">Change one variable. Watch the response.</text><g font-size="21" text-anchor="middle"><rect x="35" y="108" width="260" height="58" rx="8" fill="#f4f0e7" stroke="#b66c52" stroke-width="3"/><text x="165" y="144">N · Nitrogen</text><rect x="320" y="108" width="260" height="58" rx="8" fill="#f4f0e7" stroke="#b66c52" stroke-width="3"/><text x="450" y="144">P · Phosphorus</text><rect x="605" y="108" width="260" height="58" rx="8" fill="#f4f0e7" stroke="#b66c52" stroke-width="3"/><text x="735" y="144">Si · Silicate</text></g><rect x="35" y="184" width="545" height="270" rx="10" fill="#194d5c"/><text x="59" y="218" fill="#e1e9e3" font-size="18">Drop nutrients into the water</text><path d="M170 160Q220 197 250 259" fill="none" stroke="#d7a087" stroke-width="4" stroke-dasharray="8 6"/><path d="M237 253L253 269L258 247" fill="none" stroke="#d7a087" stroke-width="4"/><circle cx="253" cy="278" r="37" fill="#c8946b" opacity=".18"/><g fill="#d5b46c" stroke="#f1d9a1" stroke-width="2"><circle cx="169" cy="323" r="23"/><circle cx="338" cy="260" r="18"/><circle cx="427" cy="366" r="26"/><path d="M110 402l14-24 18 22-16 15Z"/><path d="M295 372l14-24 18 22-16 15Z"/></g><g fill="#9dc9bf" stroke="#d4e6dc" stroke-width="2"><path d="M378 316l14-24 18 22-16 15Z"/><path d="M244 395l14-24 18 22-16 15Z"/></g><path d="M453 296Q480 273 515 296Q483 320 453 296L438 282L438 311Z" fill="#c4d4ce"/><circle cx="503" cy="293" r="3" fill="#123e47"/><text x="59" y="434" fill="#d3e2db" font-size="17">Full symbol = 50 cells · partials show a number</text><g fill="#f4f0e7" stroke="#b66c52" stroke-width="3"><rect x="605" y="184" width="260" height="132" rx="8"/><rect x="605" y="338" width="260" height="116" rx="8"/></g><text x="623" y="219" font-size="20">Water temperature</text><text x="623" y="253" font-size="25" font-weight="bold">18°C</text><path d="M626 284H842" stroke="#90aaa3" stroke-width="7"/><circle cx="727" cy="284" r="12" fill="#173f47"/><text x="623" y="371" font-size="20">Filter-feeding fish</text><text x="623" y="413" font-size="18">Remove fish</text><rect x="746" y="384" width="102" height="45" rx="5" fill="#173f47"/><text x="797" y="412" fill="#fff" font-size="17" text-anchor="middle">Add fish</text><rect x="35" y="478" width="830" height="107" rx="8" fill="#f4f0e7"/><path d="M65 500V560H834" fill="none" stroke="#93aaa4"/><path d="M65 555Q230 553 330 536T575 516T834 532" stroke="#ae7e34" fill="none" stroke-width="3"/><path d="M65 555Q230 557 330 551T575 542T834 550" stroke="#397b7b" fill="none" stroke-width="3"/><text x="70" y="510" font-size="16">Compare counts and the graph</text><g font-size="18" text-anchor="middle"><rect x="35" y="607" width="260" height="49" rx="5" fill="#173f47"/><text x="165" y="638" fill="#fff">Run simulation / Pause</text><rect x="320" y="607" width="260" height="49" rx="5" fill="#f4f0e7" stroke="#93aaa4"/><text x="450" y="638">Advance 1 day</text><rect x="605" y="607" width="260" height="49" rx="5" fill="#f4f0e7" stroke="#93aaa4"/><text x="735" y="638">Reset experiment</text></g></g><g fill="#b66c52" stroke="#e1e9e3" stroke-width="3"><circle cx="285" cy="112" r="21"/><circle cx="855" cy="187" r="21"/><circle cx="855" cy="340" r="21"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle"><text x="285" y="120">1</text><text x="855" y="195">2</text><text x="855" y="348">3</text></g></svg>
