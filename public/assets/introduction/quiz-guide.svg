<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">How to use a lesson quiz</title><desc id="desc">Choose one option, Check answer to read feedback, then Next question. Coral outlines and numbered markers identify the controls.</desc><rect width="900" height="620" rx="20" fill="#e1e9e3"/><rect x="35" y="30" width="830" height="560" rx="14" fill="#f4f0e7" stroke="#9eb5b1"/><g fill="#173f47" font-family="Arial,sans-serif"><text x="65" y="68" font-size="16" letter-spacing="2">ILLUSTRATED QUIZ GUIDE</text><text x="65" y="110" font-size="30" font-weight="bold">Check your understanding</text><text x="65" y="144" font-size="18">Question 1 of 7 · Choose one answer</text><rect x="65" y="163" width="770" height="5" rx="2" fill="#c8d7d1"/><rect x="65" y="163" width="110" height="5" fill="#cf8d75"/><text x="65" y="204" font-size="23">Which option best fits your explanation?</text><g font-size="20"><rect x="65" y="225" width="770" height="48" rx="6" fill="#f4f0e7" stroke="#b4c5bf"/><text x="85" y="256">A</text><text x="135" y="256">An answer option</text><rect x="65" y="280" width="770" height="48" rx="6" fill="#f4f0e7" stroke="#b4c5bf"/><text x="85" y="311">B</text><text x="135" y="311">Another answer option</text><rect x="65" y="335" width="770" height="48" rx="6" fill="#dce7df" stroke="#b66c52" stroke-width="3"/><text x="85" y="366">C</text><text x="135" y="366">Your selected answer</text><rect x="65" y="390" width="770" height="48" rx="6" fill="#f4f0e7" stroke="#b4c5bf"/><text x="85" y="421">D</text><text x="135" y="421">Another answer option</text><rect x="65" y="445" width="770" height="48" rx="6" fill="#f4f0e7" stroke="#b4c5bf"/><text x="85" y="476">E</text><text x="135" y="476">Another answer option</text></g><rect x="65" y="515" width="243" height="50" rx="6" fill="#173f47" stroke="#b66c52" stroke-width="3"/><text x="186" y="547" text-anchor="middle" fill="#fff" font-size="21">Check answer</text><text x="333" y="545" font-size="18">Read feedback, then</text><rect x="542" y="515" width="293" height="50" rx="6" fill="#ede4d6" stroke="#b66c52" stroke-width="3"/><text x="688" y="547" text-anchor="middle" font-size="21">Next question →</text></g><g fill="#b66c52" stroke="#f4f0e7" stroke-width="3"><circle cx="823" cy="336" r="21"/><circle cx="300" cy="516" r="21"/><circle cx="826" cy="516" r="21"/></g><g fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle"><text x="823" y="344">1</text><text x="300" y="524">2</text><text x="826" y="524">3</text></g></svg>
